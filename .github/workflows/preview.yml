name: Preview

# Build WebGL da branch daily/* para um preview jogável, sem publicar no site da main.
# O ambiente github-pages deste repositório só aceita deploy a partir de main, então
# o site da main não é tocado. O player vai para o artifact e para uma branch
# cursor/preview-<branch>, uma por melhoria, servida pelo rawcdn.githack.
# Não reutiliza a branch de preview de outra melhoria e não faz deploy de Pages.

on:
  workflow_dispatch:
  push:
    branches:
      - daily/**

permissions:
  contents: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WebGL preview
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-lite-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-lite-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          unityVersion: auto
          buildsPath: build
          buildName: WebGL
          buildMethod: PrismaDash.EditorTools.WebGLBuilder.Build

      - name: Fix artifact ownership
        run: |
          for d in build Library; do
            if [ -d "$d" ]; then sudo chown -R "$(id -u):$(id -g)" "$d"; fi
          done

      - name: Confirm WebGL output
        run: |
          if [ ! -f build/WebGL/WebGL/index.html ]; then
            echo "index.html não encontrado em build/WebGL/WebGL" >&2
            find build -name index.html -print >&2 || true
            exit 1
          fi
          find build/WebGL/WebGL -type f -printf '%s %p\n'

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: webgl-preview
          path: build/WebGL/WebGL
          if-no-files-found: error
          retention-days: 14

      - name: Publish preview branch
        env:
          PREVIEW_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          safe=$(printf '%s' "${GITHUB_REF_NAME}" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')
          if [ -z "$safe" ]; then
            echo "nome de branch vazio; preview não publicado" >&2
            exit 1
          fi
          case "$safe" in
            main|master|gh-pages)
              echo "branch recusada para preview: $safe" >&2
              exit 1
              ;;
          esac
          PREVIEW_BRANCH="cursor/preview-${safe}"
          case "$PREVIEW_BRANCH" in
            main|master|gh-pages)
              echo "destino recusado: $PREVIEW_BRANCH" >&2
              exit 1
              ;;
          esac
          rm -rf /tmp/preview-site
          mkdir -p /tmp/preview-site
          cp -a build/WebGL/WebGL/. /tmp/preview-site/
          cd /tmp/preview-site
          git init -b "$PREVIEW_BRANCH"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Build WebGL de preview (${safe})"
          git push --force "https://x-access-token:${PREVIEW_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${PREVIEW_BRANCH}"
          sha=$(git rev-parse HEAD)
          cdn_url="https://rawcdn.githack.com/${GITHUB_REPOSITORY}/${sha}/index.html"
          branch_url="https://raw.githack.com/${GITHUB_REPOSITORY}/${PREVIEW_BRANCH}/index.html"
          echo "preview_branch=$PREVIEW_BRANCH"
          echo "preview_sha=$sha"
          echo "preview_url=$cdn_url"
          echo "preview_branch_url=$branch_url"
          {
            echo "### Preview"
            echo "$cdn_url"
            echo ""
            echo "$branch_url"
          } >> "$GITHUB_STEP_SUMMARY"
